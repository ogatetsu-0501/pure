name: Check closet itembag metadata unauthenticated
on:
  push:
    paths:
      - .github/workflows/inspect-public-closet.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public JS references and one unauthorized API status only
        run: |
          node --input-type=module <<'NODE'
          const url='https://puretomo.hange.jp/_next/static/chunks/pages/_app-1ab69aa5a650374c9816.js';
          const js=await (await fetch(url,{signal:AbortSignal.timeout(17000)})).text();
          console.log('PUBLIC SCRIPT',js.length);
          const p='api/closet/itembag.json';
          let i=-1;
          while((i=js.indexOf(p,i+1))>=0){
            console.log('ITEMBAG CLIENT',js.slice(Math.max(0,i-320),Math.min(js.length,i+550)));
          }
          const test='https://puretomo-ap.hange.jp/api/closet/itembag.json?bagcat=AA&page=1';
          const r=await fetch(test,{signal:AbortSignal.timeout(12000),headers:{Origin:'https://ogatetsu-0501.github.io'}});
          console.log('UNAUTH ENDPOINT HTTP',r.status,'allow-origin',r.headers.get('access-control-allow-origin'),'allow-credentials',r.headers.get('access-control-allow-credentials'));
          const body=await r.text();
          try {
            const obj=JSON.parse(body);
            console.log('UNAUTH RESP KEYS',Object.keys(obj),'STATUS',obj.status,'RESULT KEYS',Object.keys(obj.result||{}));
          }catch{console.log('UNAUTH CONTENT TYPE',r.headers.get('content-type'))}
          NODE
