name: Inspect closet's public API calls
on:
  push:
    paths:
      - .github/workflows/inspect-public-closet.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Find closet endpoint names in publicly served JS only
        run: |
          node --input-type=module <<'NODE'
          const url='https://puretomo.hange.jp/_next/static/chunks/pages/_app-1ab69aa5a650374c9816.js';
          const response=await fetch(url,{signal:AbortSignal.timeout(22000)});
          const js=await response.text();
          console.log('APP CHUNK HTTP',response.status,'SIZE',js.length);
          const names=['api/closet','api/avatar','api/coordinate','closetItem','itemtrade','itemCode','myItem','inventory','avatarList','closet'];
          for (const word of names) {
            const count=js.split(word).length-1;
            console.log('TERM',word,'COUNT',count);
            let i=-1,k=0;
            while((i=js.indexOf(word,i+1))>=0&&k<5){
              console.log('CONTEXT',word,'AT',i,js.slice(Math.max(0,i-130),i+180));
              k++;
            }
          }
          NODE
