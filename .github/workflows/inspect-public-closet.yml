name: Inspect closet client program only
on:
  push:
    paths:
      - .github/workflows/inspect-public-closet.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect publicly available closet JavaScript only
        run: |
          node --input-type=module <<'NODE'
          const url='https://puretomo.hange.jp/_next/static/chunks/pages/closet-4266d572a226d5b66917.js';
          const response=await fetch(url,{signal:AbortSignal.timeout(16000)});
          const js=await response.text();
          console.log('CLOSET BUNDLE:',response.status,js.length);
          const words=['itemList','getMy','closet','useQuery','getCloset','getItems','getAvatar','itemCode','avatarCode','bagcat','api/','axios','pageCount','pageSize','currentPage','userId','itemCategory','myItems'];
          for(const word of words) {
            let pos=-1,found=0;
            while((pos=js.indexOf(word,pos+1))>=0 && found<7) {
              const snippet=js.slice(Math.max(0,pos-180),Math.min(js.length,pos+240)).replaceAll(/(?:password|authorization|accessToken|idToken)[^,;}]*/gi,'[hidden]');
              console.log('MATCH',word,'at',pos,':',snippet);
              found++;
            }
          }
          NODE
