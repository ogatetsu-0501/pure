name: Diagnose 5-minute GitHub scheduler
on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schedule-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report actual trigger and times
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "runner=${{ runner.os }}"
