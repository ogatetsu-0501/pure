name: Verify incremental API fetch once
on:
  push:
    paths:
      - .github/workflows/smoke-incremental-api.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check staged source tests
        run: npm test
      - name: Read one live list and up to 15 live details, sequentially
        run: npm run update:bazaar
      - name: Report cache size (no upload or data commit)
        run: |
          ls -lh .cache/bazaar-details.json.gz
          node --input-type=module -e "import {readFile} from 'node:fs/promises'; import {gunzipSync} from 'node:zlib'; const s=JSON.parse(gunzipSync(await readFile('.cache/bazaar-details.json.gz')).toString()); console.log('cached codes:',Object.keys(s.entries).length);"
